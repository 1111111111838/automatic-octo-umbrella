name: Ultimate Downloader to Drive

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'קישור להורדה'
        required: true
      dynamic_cookies:
        description: 'עוגיות מהתוסף'
        required: false

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Cookies
        run: |
          if [ -n "${{ github.event.inputs.dynamic_cookies }}" ]; then
            echo "${{ github.event.inputs.dynamic_cookies }}" | base64 --decode > cookies.txt
          else
            touch cookies.txt
          fi

      - name: Execute Deep Download (Wget Mirror)
        run: |
          # יצירת תיקייה זמנית לריכוז כל ההורדות
          mkdir -p downloaded_site
          cd downloaded_site

          # הרצת wget במצב זחילה עמוק (Mirror)
          # p- : מוריד את כל התמונות והתוכן שמציג את הדף בצורה נכונה
          # H- : מאפשר לעבור לשרתים אחרים (למשל אם התמונות יושבות על שרת תמונות חיצוני)
          # k- : ממיר את הקישורים המקומיים כדי שהדף יעבוד אופליין מהמחשב
          # nd- : שומר את כל הקבצים במבנה שטוח בלי ליצור מיליון תיקיות פנימיות
          # l 1- : עומק זחילה של שלב אחד קדימה (מוריד את הקישורים הישירים שבדף)
          wget --mirror -p -H -k -nd -l 1 \
               --load-cookies ../cookies.txt \
               --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
               --header="Referer: https://chat.google.com/" \
               "${{ github.event.inputs.file_url }}" || true

          cd ..
          
          # אריזת כל התוכן לקובץ ZIP אחד מסודר עם חותמת זמן כדי שלא יישבר ב-Drive
          ZIP_NAME="downloaded_content_$(date +%Y%m%d_%H%M%S).zip"
          zip -r "$ZIP_NAME" downloaded_site/ -x "cookies.txt"
          
          # הגדרת שם הקובץ החדש עבור שלב ה-Python
          echo "DOWNLOADED_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Install Dependencies
        run: pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Upload to Drive
        shell: python
        env:
          OAUTH_DATA: ${{ secrets.GDRIVE_OAUTH_JSON }}
          FILE_NAME: ${{ env.DOWNLOADED_NAME }}
          FOLDER_ID: '1wdXtGCAAKSQMao-ij514dJbGK-UlJGen'
        run: |
          import os, json
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          data = json.loads(os.environ['OAUTH_DATA'])
          
          creds = Credentials(
              None,
              refresh_token=data['refresh_token'],
              client_id=data['client_id'],
              client_secret=data['client_secret'],
              token_uri="https://oauth2.googleapis.com/token"
          )
          drive_service = build('drive', 'v3', credentials=creds)

          file_metadata = {'name': os.environ['FILE_NAME'], 'parents': [os.environ['FOLDER_ID']]}
          media = MediaFileUpload(os.environ['FILE_NAME'], resumable=True)
          drive_service.files().create(body=file_metadata, media_body=media).execute()
          print("🎉 קובץ ה-ZIP המרוכז הועלה בהצלחה לחשבון האישי שלך!")
