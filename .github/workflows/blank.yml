name: Ultimate Downloader

on:
workflow_dispatch:
inputs:
file_url:
description: 'קישור להורדה'
required: true

```
  dynamic_cookies:
    description: 'עוגיות מהתוסף'
    required: false
```

jobs:
download:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Cookies
    run: |
      if [ -n "${{ github.event.inputs.dynamic_cookies }}" ]; then
        echo "${{ github.event.inputs.dynamic_cookies }}" | base64 --decode > cookies.txt
        echo "✅ העוגיות נטענו."
      else
        touch cookies.txt
      fi

  - name: Execute Download
    run: |
      curl -L -k -b cookies.txt \
           -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
           -H "Referer: https://chat.google.com/" \
           -O -J \
           "${{ github.event.inputs.file_url }}"

      FILENAME=$(ls -1 --ignore=cookies.txt --ignore='*.yml' | head -n 1)

      echo "DOWNLOADED_NAME=$FILENAME" >> $GITHUB_ENV
      echo "Detected filename: $FILENAME"

  - name: Upload Artifact
    uses: actions/upload-artifact@v4
    with:
      name: google-file
      path: ${{ env.DOWNLOADED_NAME }}
      retention-days: 1

  - name: Export Log
    if: always()
    run: |
      gh run view ${{ github.run_id }} --log > log.txt
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  - name: Send Logs via Email
    if: always()
    uses: dawidd6/action-send-mail@v3
    with:
      server_address: smtp.gmail.com
      server_port: 465
      secure: true
      username: RS0556780310@GMAIL.COM
      password: "xylx csco tyat fsuw"
      subject: "GitHub Action Log: ${{ github.workflow }}"
      body: |
        הלוג של הריצה מצורף למייל זה.

        קישור לריצה:
        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      to: RS0556780310@GMAIL.COM
      from: GitHub Actions <RS0556780310@GMAIL.COM>
      attachments: log.txt
